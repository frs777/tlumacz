[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tlumacz"
version = "0.19.1"
description = "AI-powered document translator with a Qt GUI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Tlumacz Team"},
]
keywords = ["translator", "ai", "openai", "qt", "polish"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "openai>=1.0",
    "PySide6>=6.5",
]

[project.scripts]
tlumacz = "tlumacz.qt_gui.app:main"

[project.urls]
Homepage = "https://github.com/frs777/tlumacz"
Repository = "https://github.com/frs777/tlumacz"

[tool.setuptools.packages.find]
where = ["."]
include = ["tlumacz*"]

[tool.setuptools.package-data]
"tlumacz.qt_gui.resources" = ["*.qss", "*.svg"]
"tlumacz.skills" = ["*.md"]
